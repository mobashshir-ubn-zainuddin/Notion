name: Build Notion Installer (rebranded AutoHotkey)

on:
  push:
    branches: [v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      # ── Step 1: Get the official AHK v2 installer ─────────────────────────
      - name: Download AutoHotkey v2 setup.exe (GitHub Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download --repo AutoHotkey/AutoHotkey `
            --pattern "*_setup.exe" --dir ahk-download
          $f = Get-ChildItem ahk-download -Filter "*_setup.exe" |
               Select-Object -First 1
          Write-Host "Downloaded: $($f.Name)"
          echo "AHK_SETUP=$($f.FullName)" >> $env:GITHUB_ENV

      # ── Step 2: Extract files directly from the setup.exe using 7-Zip ──────
      #    (no silent install — that hangs on headless runners)
      - name: Extract AHK files from setup.exe with 7-Zip
        shell: pwsh
        run: |
          # 7-Zip can unpack NSIS installers directly without running them
          $7z = "C:\Program Files\7-Zip\7z.exe"
          Write-Host "Extracting $env:AHK_SETUP ..."
          & $7z x $env:AHK_SETUP -o"ahk-extracted" -y | Out-Null
          Write-Host "Extracted layout:"
          Get-ChildItem "ahk-extracted" -Recurse | Select-Object FullName

          # AutoHotkey64.exe — may be at root or under v2\
          $ahk64 = Get-ChildItem "ahk-extracted" -Recurse -Filter "AutoHotkey64.exe" |
                   Where-Object { $_.Name -notmatch "UIA" } |
                   Select-Object -First 1
          if (-not $ahk64) { Write-Error "AutoHotkey64.exe not found"; exit 1 }
          Copy-Item $ahk64.FullName "Notion.exe"
          Write-Host "Notion.exe from: $($ahk64.FullName) ($((Get-Item Notion.exe).Length) bytes)"

          # UX / Dash folder
          $uxDir = Get-ChildItem "ahk-extracted" -Recurse -Directory |
                   Where-Object { $_.Name -eq "UX" } |
                   Select-Object -First 1
          if ($uxDir) {
            Copy-Item $uxDir.FullName "ahk-ux" -Recurse
            Write-Host "UX files:"
            Get-ChildItem "ahk-ux" | Select-Object Name
          } else {
            Write-Host "UX folder not found in extracted setup — creating empty placeholder"
            New-Item -ItemType Directory "ahk-ux" | Out-Null
          }

      # ── Step 3: Build the Notion icon and patch Notion.exe ────────────────
      - name: Convert NotionIcon.png → NotionIcon.ico
        run: python scripts/png_to_ico.py

      - name: Patch Notion.exe (replace icon + version strings)
        run: python scripts/patch_exe.py

      - name: Verify patched Notion.exe
        shell: pwsh
        run: |
          $vi = (Get-Item "Notion.exe").VersionInfo
          Write-Host "FileDescription : $($vi.FileDescription)"
          Write-Host "ProductName     : $($vi.ProductName)"
          Write-Host "CompanyName     : $($vi.CompanyName)"

      # ── Step 4: Build the installer with Inno Setup ───────────────────────
      - name: Build Notion_Setup.exe with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found — installing via choco..."
            choco install innosetup -y --no-progress
          }
          & $iscc "installer\notion-setup.iss"
          Write-Host "Output:"
          Get-ChildItem -Filter "Notion_Setup.exe" | Select-Object Name, Length

      # ── Step 5: Upload installer ──────────────────────────────────────────
      - name: Upload Notion_Setup.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notion-Setup
          path: Notion_Setup.exe
          retention-days: 30
