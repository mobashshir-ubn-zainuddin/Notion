name: Build Notion (rebranded AutoHotkey)

on:
  push:
    branches: [v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Download AutoHotkey v2 (from GitHub Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Download latest AHK v2 portable zip via gh CLI (avoids Cloudflare on autohotkey.com)
          gh release download --repo AutoHotkey/AutoHotkey --pattern "*.zip" --dir ahk-download
          $zip = Get-ChildItem ahk-download -Filter "*.zip" | Select-Object -First 1
          Write-Host "Downloaded: $($zip.Name)"
          Expand-Archive $zip.FullName -DestinationPath "ahk-v2"
          Write-Host "Extracted:"
          Get-ChildItem "ahk-v2" -Recurse | Select-Object FullName

      - name: Copy AutoHotkey64.exe as Notion.exe
        shell: pwsh
        run: |
          $ahk = Get-ChildItem "ahk-v2" -Recurse -Filter "AutoHotkey64.exe" |
                 Where-Object { $_.Name -notmatch "UIA" } |
                 Select-Object -First 1
          if (-not $ahk) {
            Write-Error "AutoHotkey64.exe not found in extracted zip"
            exit 1
          }
          Write-Host "Using: $($ahk.FullName)"
          Copy-Item $ahk.FullName "Notion.exe"
          Write-Host "Copied: $((Get-Item Notion.exe).Length) bytes"

      - name: Convert NotionIcon.png to ICO
        run: python scripts/png_to_ico.py

      - name: Patch Notion.exe (icon + version info)
        run: python scripts/patch_exe.py

      - name: Verify patched exe
        shell: pwsh
        run: |
          $vi = (Get-Item "Notion.exe").VersionInfo
          Write-Host "FileDescription : $($vi.FileDescription)"
          Write-Host "ProductName     : $($vi.ProductName)"
          Write-Host "CompanyName     : $($vi.CompanyName)"

      - name: Upload Notion.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notion-exe
          path: |
            Notion.exe
            NotionIcon.ico
          retention-days: 30
