name: Build Notion Installer (rebranded AutoHotkey)

on:
  push:
    branches: [v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      # ── Step 1: Download the portable AHK v2 zip (no installer needed) ──────
      - name: Download AutoHotkey v2 portable zip (GitHub Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download --repo AutoHotkey/AutoHotkey `
            --pattern "AutoHotkey_*.zip" --dir ahk-download
          $f = Get-ChildItem ahk-download -Filter "*.zip" | Select-Object -First 1
          Write-Host "Downloaded: $($f.Name)"
          Expand-Archive $f.FullName -DestinationPath "ahk-zip"
          Write-Host "Zip contents:"
          Get-ChildItem "ahk-zip" -Recurse | Select-Object FullName

      # ── Step 2: Copy AutoHotkey64.exe as Notion.exe ───────────────────────
      - name: Copy AutoHotkey64.exe as Notion.exe
        shell: pwsh
        run: |
          $ahk64 = Get-ChildItem "ahk-zip" -Recurse -Filter "AutoHotkey64.exe" |
                   Where-Object { $_.Name -notmatch "UIA" } |
                   Select-Object -First 1
          if (-not $ahk64) { Write-Error "AutoHotkey64.exe not found"; exit 1 }
          Copy-Item $ahk64.FullName "Notion.exe"
          Write-Host "Notion.exe: $((Get-Item Notion.exe).Length) bytes"

      # ── Step 3: Build the Notion icon and patch Notion.exe ────────────────
      - name: Convert NotionIcon.png → NotionIcon.ico
        run: python scripts/png_to_ico.py

      - name: Patch Notion.exe (replace icon + version strings)
        run: python scripts/patch_exe.py

      - name: Verify patched Notion.exe
        shell: pwsh
        run: |
          $vi = (Get-Item "Notion.exe").VersionInfo
          Write-Host "FileDescription : $($vi.FileDescription)"
          Write-Host "ProductName     : $($vi.ProductName)"
          Write-Host "CompanyName     : $($vi.CompanyName)"

      # ── Step 4: Build the installer with Inno Setup ───────────────────────
      - name: Build Notion_Setup.exe with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found — installing via choco..."
            choco install innosetup -y --no-progress
          }
          & $iscc "installer\notion-setup.iss"
          Write-Host "Output:"
          Get-ChildItem -Filter "Notion_Setup.exe" | Select-Object Name, Length

      # ── Step 5: Upload installer ──────────────────────────────────────────
      - name: Upload Notion_Setup.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notion-Setup
          path: Notion_Setup.exe
          retention-days: 30
